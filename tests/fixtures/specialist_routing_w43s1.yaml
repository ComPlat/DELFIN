# Labelled request set for specialist routing (wave 43, package s1).
#
# WHAT THIS IS. Thirty user requests in the languages and domains the
# dashboard is actually used in — German and English, across chemistry,
# cluster operations, the lab, code and writing — each with the ONE
# specialist that should take it, or `none` when the generalist should
# keep it. It is the labelled set the routing measure runs over:
# `python scripts/routing_matrix_w43s1.py` drives every row through the
# product's real entry point and prints the confusion matrix.
#
# WHO LABELLED IT, AND WITH WHAT. The labels were written by the agent
# that authored this file, from the shipped preset descriptions in
# `delfin/agent/pack/agents/*_subagent.md`, BEFORE any matcher was
# written (the prediction step) and reviewed once afterwards. They are
# one reader's judgement, not an inter-annotated corpus: the matrix
# therefore measures *how the machine's choice relates to one careful
# reading of the descriptions*, not agreement between people. A row where
# the machine and the label disagree is a question to adjudicate by hand,
# never automatically a machine error — and a row where they agree is not
# proof the label was right.
#
# POPULATION (rule 9). The 30 rows are not a sample of real traffic. The
# one traffic measurement this repo has is `~/.delfin/tool_traces`: the
# subagent tool was dispatched 50 times in 79,056 tool calls, 44 of them
# `explore`. That population is the roles a model chose, in the work a
# model happened to be asked for; it does not describe how often a user
# asks for a TS in the first place. Nothing in this file is a frequency
# estimate about users.
#
# `ambiguous: true` marks the rows where the honest answer is that a
# generalist could hand the request to more than one specialist — for
# those, `expect` records the better choice and the measure reports a
# pick of the other acceptable one separately rather than as a plain hit.

requests:

  # --- chemistry: excited states, spectra, methods --------------------
