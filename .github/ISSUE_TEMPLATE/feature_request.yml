name: Feature request
description: Something DELFIN should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The chemistry or the workflow, not the implementation. Knowing what
        question you are trying to answer often changes what the right feature
        is.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: What you currently run, and where that falls short.

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A sketch of the interface, a CONTROL key, a command.
