name: Bug report
description: Something DELFIN did that it should not have
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A calculation that produced a wrong number is worth more detail than one
        that crashed — a crash announces itself, a wrong number does not.

        Please do not report a security problem here. See
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What DELFIN did, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: >
        The CONTROL.txt and the input geometry or SMILES, and the command you
        ran. A minimal case helps, but a real one that reproduces beats a
        small one that does not.
      render: text
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: What DELFIN reported
      description: >
        The relevant part of delfin_*.out or the ORCA output. Please paste the
        text rather than a screenshot — it needs to be searchable.
      render: text

  - type: input
    id: version
    attributes:
      label: DELFIN version
      description: "`delfin --version`, or the commit you are on."
    validations:
      required: true

  - type: input
    id: programs
    attributes:
      label: ORCA / xTB / CREST versions
      description: Which versions of the underlying programs were driven.

  - type: dropdown
    id: where
    attributes:
      label: Where it ran
      options:
        - Local machine
        - SLURM cluster
        - Other scheduler
    validations:
      required: true
