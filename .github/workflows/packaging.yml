name: Packaging

# Builds the sdist and the wheel the way a release would and checks what is
# inside them (scripts/check_distribution.py): the GPL-3.0 and LGPL-3.0 texts
# and the PEP 639 licence metadata must be there, and no third-party program,
# parameter file or native code may be.
#
# The published 1.1.8 to 1.1.12 releases carry xtb4stda and stda_v1.6.1
# (LGPL-3.0, grimme-lab/xtb4stda) because the build selected whatever
# install_qm_tools.sh had downloaded on the building machine. A CI checkout
# never has those files, so a check on a clean tree alone would pass on the
# configuration that shipped them. The job therefore plants stand-ins at the
# installer's paths first and builds twice: sdist -> wheel (what PyPI gets)
# and a wheel straight from the tree (what `pip wheel .` gives).
#
# Network: PyPI for the pinned build tools only. The build tools are
# installed by hash from .github/ci/release-requirements.txt, as in
# release.yml; the other tools with .github/ci/constraints-ci.txt, like in
# the other workflows; the actions are pinned to commit SHAs. The build itself
# runs with --no-isolation against those pins, and SOURCE_DATE_EPOCH is
# the commit time, so one commit always builds from the same toolchain.
#
# A second job checks the licences of the dependencies a plain install
# pulls in (see its own comment), a third that every file of the repository
# carries copyright and licence information (REUSE.toml, `reuse lint`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: packaging-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  distribution:
    name: distribution contents
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the pinned build tools
        # The same hashed file release.yml builds with, so a pull request
        # builds with the toolchain a release would.
        run: |
          python -m pip install --require-hashes -r .github/ci/release-requirements.txt

      - name: Plant installer output where a release machine would have it
        run: |
          mkdir -p delfin/qm_tools/bin delfin/qm_tools/share/xtb4stda delfin/qm_tools/downloads
          printf '\177ELF\002\001\001stand-in' > delfin/qm_tools/bin/xtb4stda
          printf '\177ELF\002\001\001stand-in' > delfin/qm_tools/bin/stda_v1.6.1
          printf 'stand-in' > delfin/qm_tools/share/xtb4stda/.param_stda1.xtb
          printf 'stand-in' > delfin/qm_tools/share/xtb4stda/.xtb4stdarc
          printf 'stand-in' > delfin/qm_tools/downloads/xtb4stda

      - name: Build sdist and wheel
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --no-isolation --outdir dist .
          python -m build --no-isolation --wheel --outdir dist-direct .

      - name: Check the distributions
        run: |
          python scripts/check_distribution.py dist/*.tar.gz dist/*.whl dist-direct/*.whl

      - name: List what was built
        if: always()
        run: |
          ls -l dist dist-direct || true
          for w in dist/*.whl; do unzip -l "$w" | grep -E 'dist-info/(licenses/|METADATA)' || true; done

  dependency-licences:
    name: dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The licences of what `pip install delfin-complat` (no extras) puts into
    # an environment, read from the installed metadata with pip-licenses and
    # judged by scripts/check_dependency_licences.py against the reviewed
    # allow-list scripts/dependency_licences.toml: AGPL, SSPL, a GPL,
    # proprietary or UNKNOWN fails unless an entry names the package and the
    # exact licence string. dependency-review.yml cannot do this: the
    # dependency graph records no licence for pymupdf or openbabel-wheel.
    # The dependency set is resolved fresh on every run, so a new transitive
    # dependency is judged the day it arrives.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pip-licenses, and DELFIN without extras
        # pip-licenses first and pinned; DELFIN after it without
        # constraints, so its dependencies resolve as for a user and a
        # pinned helper never moves one of them.
        run: |
          python -m pip install -c .github/ci/constraints-ci.txt --upgrade pip
          pip install -c .github/ci/constraints-ci.txt pip-licenses
          pip install .

      - name: Check the licences
        run: |
          pip-licenses --from=mixed --format=json --output-file deps.json
          python scripts/check_dependency_licences.py deps.json

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every file has an SPDX licence and a copyright line, through the bulk
    # annotations of REUSE.toml, and every licence named has its text in
    # LICENSES/. A new vendored file needs an override entry there and a
    # section in THIRD_PARTY_NOTICES.md.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Lint
        run: |
          python -m pip install -c .github/ci/constraints-ci.txt --upgrade pip
          pip install -c .github/ci/constraints-ci.txt reuse
          reuse lint
