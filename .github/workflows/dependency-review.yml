name: Dependency review

# Runs on a pull request that changes the dependencies and says what it would
# pull in: known advisories, and licences that do not fit.
#
# This is the half that Dependabot's security updates do not cover. Those react
# to an advisory published against something already installed; this one
# catches a dependency being added that carries one today, before it is merged
# rather than after.
#
# It fails the pull request on a high-severity advisory. That is a narrower
# gate than it sounds: a moderate finding is reported and merges anyway, so the
# check only stands in the way of knowingly adding something seriously broken.
#
# `dependency review` is a required check, so it also runs for a merge-queue
# group. There the action takes the group's base_sha and head_sha from the
# merge_group event (src/git-refs.ts in actions/dependency-review-action):
# it reviews what the group adds to main, this entry's change together with
# the entries ahead of it. comment-summary-in-pr has no pull request to
# comment on there and is skipped with a warning (src/comment-pr.ts).
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review the dependency change
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # DELFIN is LGPL-3.0-or-later and is installed by academic groups who
          # have to know what they are running. A copyleft licence stricter
          # than the project's own would quietly change what users may do with
          # it, so those are flagged for a person rather than accepted.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
