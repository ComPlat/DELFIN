name: Windows launcher
on:
  pull_request:
    paths:
      - 'tools/windows-launcher/**'
      - 'delfin/cli_voila.py'
      - '.github/workflows/windows-launcher.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: ./tools/windows-launcher/Test-Launcher.ps1 -SkipOpenSSHCheck
