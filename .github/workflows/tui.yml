name: TUI

# The terminal window (tui/, TypeScript on Bun and OpenTUI) and the agent
# service behind it (delfin/agent/service/): unit tests on both sides, the
# protocol types in step with the Python definition, the live checks in
# tmux, and the window as one executable per platform.
#
# `window and service` is a required check on main (docs/MAIN_PROTECTION.md),
# so it must report on every pull request: a `paths:` filter on
# pull_request would leave a pull request outside those paths waiting for
# it indefinitely. The workflow starts on every pull request and the
# `changes` job decides whether the window tests apply; a job skipped by its
# `if:` counts as passed. On main it still starts only for what it covers.
on:
  push:
    branches: [main, tui-rewrite]
    paths:
      - "tui/**"
      - "delfin/agent/service/**"
      - "tests/test_a_tui_*.py"
      - "tests/test_the_tui_*.py"
      - "tests/test_the_agent_service_*.py"
      - "tests/tui_service.py"
      - ".github/workflows/tui.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: tui-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: what the change covers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      covered: ${{ steps.diff.outputs.covered }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Files against the base
        id: diff
        # A pull request is checked out as its merge commit, whose first
        # parent is the base. The patterns are the push filter above. If
        # the diff cannot be read the tests run: a failure here must never
        # turn into a skipped required check.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          covered=true
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only HEAD^1 HEAD); then
            covered=false
            while IFS= read -r f; do
              case "$f" in
                tui/*|delfin/agent/service/*|tests/test_a_tui_*.py|tests/test_the_tui_*.py) covered=true ;;
                tests/test_the_agent_service_*.py|tests/tui_service.py|.github/workflows/tui.yml) covered=true ;;
              esac
            done <<< "$files"
          fi
          echo "covered=$covered"
          echo "covered=$covered" >> "$GITHUB_OUTPUT"

  test:
    name: window and service
    needs: changes
    # Skipped only on a definite "not covered". Without !cancelled() a failed
    # `changes` job would skip this one too, and a skipped required check
    # passes; so a failure there runs the tests instead.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.covered == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install DELFIN
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[agent,dev]"

      - name: Set up Bun 1.4.3
        # The release archive, checked against a pinned hash, rather than a
        # setup action: a repository that allows GitHub's own actions only
        # refuses to start a workflow naming another one.
        run: tui/scripts/install-bun.sh 1.4.3

      - name: The window's dependencies, with OpenTUI's patched native library
        # The prebuilt library loses scrollback rows in xterm.js when the
        # footer grows (opentui#1630); the build script builds the pinned
        # source with the fix and checks it (docs/TUI_REWRITE.md).
        working-directory: tui
        run: |
          bun install --frozen-lockfile
          scripts/build-opentui-native.sh

      - name: Window tests, types and protocol
        working-directory: tui
        run: |
          bun test
          bun x tsc --noEmit
          DELFIN_PYTHON="$(command -v python)" bun scripts/gen-protocol.ts --check

      - name: Service tests
        run: >
          pytest -q --timeout=300 --timeout-method=signal
          tests/test_a_tui_*.py tests/test_the_tui_*.py tests/test_the_agent_service_*.py

      - name: Live checks in tmux
        # check_startup_tmux holds the binary's launch relative to the source
        # launch measured in the same job; no wall-clock budget is set here.
        run: |
          sudo apt-get install -y -q tmux
          for check in check_tui_tmux check_composer_tmux check_switch_tmux check_agents_tmux \
                       check_attention_tmux check_lifecycle_tmux check_resize_tmux check_fullscreen_tmux \
                       check_startup_tmux; do
            echo "== $check"
            DELFIN_PYTHON="$(command -v python)" python "tui/test/e2e/$check.py"
          done

  binary:
    name: binary (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: bun-linux-x64, patched: true }
          - { os: ubuntu-24.04-arm, target: bun-linux-arm64, patched: true }
          # macOS: the prebuilt native library for now -- the patched build
          # script does not build Darwin yet (on the user checklist).
          - { os: macos-14, target: bun-darwin-arm64, patched: false }
          # macos-13 is retired; macos-15-intel is the x86_64 image.
          - { os: macos-15-intel, target: bun-darwin-x64, patched: false }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun 1.4.3
        run: tui/scripts/install-bun.sh 1.4.3

      - name: Build
        working-directory: tui
        run: |
          bun install --frozen-lockfile
          if [ "${{ matrix.patched }}" = "true" ]; then scripts/build-opentui-native.sh; fi
          bun scripts/build-binary.ts "${{ matrix.target }}"

      - name: Smoke test
        # Started without the service it names nothing to talk to: it must
        # load (the native library, the embedded worker) and say so.
        working-directory: tui
        run: |
          set +e
          out=$(./dist/delfin-tui-* 2>&1); code=$?
          echo "$out"
          [ "$code" = 2 ] && echo "$out" | grep -q "delfin-agent tui"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: delfin-tui-${{ matrix.target }}
          path: tui/dist/delfin-tui-*
          retention-days: 14
