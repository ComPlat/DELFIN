name: CodeQL

# Static analysis for the parts of DELFIN that are exposed to input it did not
# write. For a package that only did arithmetic this would be decoration; here
# the agent executes tools and writes files, the dashboard serves files over a
# browser, ORCA and xTB are started through a shell with paths that came from
# user input, and YAML and JSON are loaded. Those are the four areas
# SECURITY.md names as in scope, and they are what CodeQL's Python queries look
# for: path traversal, command injection, unsafe deserialisation, SSRF.
#
# Findings land in the Security tab rather than failing a build. That is
# deliberate and it is also how the action behaves: a static analyser reporting
# a possible flaw is the start of a conversation, not a reason to stop somebody
# merging a change to a report template.
on:
  push:
    branches: [main]
  pull_request:
  # analyze (python) and analyze (actions) are required checks; a merge
  # queue waits for them on its gh-readonly-queue/main/* ref, and the
  # CodeQL action analyses and uploads for that ref like for a push.
  merge_group:
  schedule:
    # Weekly, so a query added upstream reaches this code without waiting for
    # somebody to push.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Only what uploading results needs.
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # "actions" reads .github/workflows itself. The workflows here are
        # currently clean — no third-party actions, no pull_request_target,
        # github.event_name only in if: conditions, contents: read everywhere
        # — and the point of scanning them is that the next workflow somebody
        # adds is held to the same line. A workflow runs with a token against
        # this repository, so an injected expression in a run: block reaches
        # further than most of the Python does.
        language: [python, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          # security-extended adds the queries that are worth a look but too
          # noisy to gate on. Nothing here gates, so the wider net costs only
          # analysis time.
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
