name: CodeQL

# Static analysis for the parts of DELFIN that are exposed to input it did not
# write. For a package that only did arithmetic this would be decoration; here
# the agent executes tools and writes files, the dashboard serves files over a
# browser, ORCA and xTB are started through a shell with paths that came from
# user input, and YAML and JSON are loaded. Those are the four areas
# SECURITY.md names as in scope, and they are what CodeQL's Python queries look
# for: path traversal, command injection, unsafe deserialisation, SSRF.
#
# Findings land in the Security tab rather than failing a build. That is
# deliberate and it is also how the action behaves: a static analyser reporting
# a possible flaw is the start of a conversation, not a reason to stop somebody
# merging a change to a report template.
on:
  push:
    branches: [main]
  pull_request:
  # analyze (python) and analyze (actions) are required checks; a merge
  # queue waits for them on its gh-readonly-queue/main/* ref, and the
  # CodeQL action analyses and uploads for that ref like for a push.
  merge_group:
  schedule:
    # Weekly, so a query added upstream reaches this code without waiting for
    # somebody to push.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Only what uploading results needs.
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # "actions" reads .github/workflows itself. The workflows here are
        # kept clean — no third-party actions, github.event_name only in if:
        # conditions, contents: read everywhere — and the point of scanning
        # them is that the next workflow somebody adds is held to the same
        # line. One reviewed exception: ratings.yml runs on
        # pull_request_target (so a helper's pull request from a fork can be
        # merged automatically); it runs only the base commit's files, reads
        # the pull request as git objects without checking it out, and gives
        # write permissions only to two jobs that check out nothing. A
        # workflow runs with a token against this repository, so an injected
        # expression in a run: block reaches further than most of the Python
        # does.
        #
        # "javascript-typescript" is the terminal window (tui/src, TypeScript
        # that ships in the sdist and the wheel and runs with the user's
        # rights); it was listed by the code-scanning API as present and
        # unscanned. Its check, `analyze (javascript-typescript)`, is not
        # required: findings land in the Security tab, as for the other two,
        # and a check is worth requiring once a few runs show it finishes
        # reliably. The repository has no C# since the Windows launcher
        # stopped compiling a starter program; a csharp job would find no
        # source to analyse.
        language: [python, actions, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # No build for any of the three: Python, actions and
          # JavaScript/TypeScript are analysed from source and have no other
          # mode.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          # security-extended adds the queries that are worth a look but too
          # noisy to gate on. Nothing here gates, so the wider net costs only
          # analysis time.
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
