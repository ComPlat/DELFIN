name: CI

# Automated gate for every push to main and every pull request. The suite is
# fully mocked (no live KIT/Ollama/Claude calls), so no secrets are required.
#
# Two tiers (tests/conftest.py auto-marks the heavy + order-dependent tests
# `slow`):
#   - `tests` (fast gate, REQUIRED): everything EXCEPT the slow set. ~minutes.
#     This is the merge gate that runs on every push/PR.
#   - `slow-tests` (informational): the heavy MANTA build tests (construct full
#     complexes; the full serial suite is >90 min) plus a few order-dependent
#     tests that only pass in the full serial context. These DO NOT fit a
#     per-commit gate (they time out and mark the whole run "cancelled"), so
#     they run NIGHTLY on a schedule (and on manual dispatch) instead — keeping
#     every push/PR green while still exercising the heavy suite daily. Promote
#     back into the gate once test isolation/speed is improved.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly heavy-suite run (03:17 UTC) — see slow-tests job.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save CI minutes -- but not
# on main. There, a superseded run is not wasted work: every commit on the
# default branch is a state somebody may check out, and the only report on
# whether it holds is its own run. Cancelling it leaves that commit
# unverified and says nothing about it, and with several people pushing, a
# run that takes longer than the gap between pushes is cancelled every time,
# so main can go a whole morning without a single completed check while the
# run list shows nothing but "cancelled". A pull request is the other case:
# only its latest revision is going to be merged, so superseding is exactly
# right there and stays on.
#
# `cancel-in-progress` is only half of it: a run that is still QUEUED is
# cancelled by the next one to enter its group no matter what that flag
# says, and with one runner most pushes to main sit queued behind the run
# before them. So on main the commit itself is the group -- a run there is
# alone in its group, waits its turn, and is never superseded. Elsewhere
# the ref is the group, which is what makes a new revision replace the old.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: test_pre_refactor_api_preserved.py compares the public
          # API against a pre-refactor commit via `git show`. A shallow clone
          # lacks it -> 0 cases -> that guard test fails.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[agent,docs,dev]"

      - name: Run fast test suite (excludes heavy + order-dependent tests)
        run: pytest -q -m "not slow"

  slow-tests:
    name: slow tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Nightly / manual only — never on push or PR, so a timeout here can never
    # mark a per-commit run "cancelled". The fast gate above is the merge check.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 240
    # Informational while heavy-test speed + test isolation are improved.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[agent,docs,dev]"

      - name: Run slow (heavy + order-dependent) tests
        run: pytest -q -m "slow"

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A required check, and scoped so that a failure means something is broken.
    #
    # The rules below are the ones that describe a defect: a name that does not
    # exist, a definition silently replacing another, a duplicate dictionary
    # key, an import shadowed by a loop variable, a local used before it is
    # bound. Every one of them has already cost this project something — the
    # NameError in dashboard/__init__.py, the test in test_office_documents.py
    # that never ran because a later function took its name, the UnboundLocal
    # in the ORCA process-group cleanup that stopped it ever sending SIGKILL.
    #
    # Deliberately not gated: F401 (500), F841 (120) and F541 (117). Unused
    # imports, unused variables and f-strings without placeholders are untidy,
    # not broken, and a gate that fails on untidiness trains people to look for
    # the incantation that makes it pass. They stay visible through `ruff check
    # --select F` when anybody wants to work them down.
    #
    # ruff is pinned. Unpinned, a release that adds or widens a rule turns main
    # red for everybody without a line having changed — the same shape of
    # accident as an unbounded dependency. Raising the pin is a small, ordinary
    # pull request: bump it, see what the new version says, fix or accept.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.3

      - name: Lint for real defects
        run: |
          ruff check delfin/ tests/ \
            --select F821,F811,F601,F402,F823 \
            --output-format github

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Also reporting rather than gating, and green while it reports. A freshly
    # published advisory against a transitive dependency would otherwise mark
    # work that has nothing to do with it as failing, and DELFIN's dependency
    # tree is deep enough that this happens regularly. The findings land in the
    # run summary; the nightly schedule means one surfaces within a day even if
    # nobody pushes.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + audit tool
        run: |
          python -m pip install --upgrade pip
          pip install -e "." pip-audit

      - name: Audit installed dependencies for known advisories
        run: |
          {
            echo "### pip-audit"
            echo
            echo '```'
            pip-audit --progress-spinner off || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pip-audit --progress-spinner off || true
