name: CI

# The gate for every push to main, every pull request and every merge-queue
# group. The suite is fully mocked (no live KIT/Ollama calls), so no secrets
# are required.
#
# Everything in this file either gates or is cheap enough to sit beside what
# gates: `tests` (fast suite), `lint`, `container`, `toolchains` and
# `reference-env` (all five required on main, docs/MAIN_PROTECTION.md),
# `audit` (reported, not required), and `coverage` on the nightly schedule. What that buys is a run conclusion that
# means something — CI green says the gate passed, and nothing else in here
# can take that away.
#
# The heavy half of the suite is in slow-tests.yml, and lives there for that
# reason. As a job in this file it cancelled its own predecessor on every
# push — correct for a ninety-minute informational run — but a cancelled job
# makes the whole run read "cancelled", and main showed nothing else for six
# commits while both required checks passed every time. Two audiences, two
# files: one answers "may this merge", the other "does the heavy suite still
# hold", and neither now overwrites the other's answer.
on:
  push:
    branches: [main]
  pull_request:
  # A merge queue tests the combination it is about to merge on a
  # gh-readonly-queue/main/* ref and waits for every required check there;
  # a workflow without this trigger never reports and the entry times out.
  merge_group:
  schedule:
    # Nightly, for the coverage and audit reports below.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save CI minutes -- but not
# on main. There, a superseded run is not wasted work: every commit on the
# default branch is a state somebody may check out, and the only report on
# whether it holds is its own run. Cancelling it leaves that commit
# unverified and says nothing about it, and with several people pushing, a
# run that takes longer than the gap between pushes is cancelled every time,
# so main can go a whole morning without a single completed check while the
# run list shows nothing but "cancelled". A pull request is the other case:
# only its latest revision is going to be merged, so superseding is exactly
# right there and stays on.
#
# `cancel-in-progress` is only half of it: a run that is still QUEUED is
# cancelled by the next one to enter its group no matter what that flag
# says, and with one runner most pushes to main sit queued behind the run
# before them. So on main the commit itself is the group -- a run there is
# alone in its group, waits its turn, and is never superseded. Elsewhere
# the ref is the group, which is what makes a new revision replace the old.
#
# A merge-queue run is the main case, not the pull-request one: its commit
# is what main becomes if it passes, and the queue removes or rebuilds an
# entry itself. So it is grouped by its own commit (prefixed, so the push
# of the same commit after the merge never shares its group) and never
# cancelled from here.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'merge_group' && format('queue-{0}', github.sha) || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  test-shard:
    # The fast suite, split by test file over four runners. In one job it
    # ran 27-34 min on 2026-10-13 and 47.7 min of tests on 2026-10-15
    # against a 50-minute limit; three of the five runs on main before that
    # were cancelled at the limit. Each shard collects the whole suite and
    # runs the files .github/ci/ci_shards.py assigns it by measured
    # duration (702 s of the 2810 s measured on the runner). The required
    # check is `tests (py3.11)` below, which passes only when the four
    # together ran every collected test exactly once.
    #
    # Each shard is its own runner, so no state is shared between them.
    # The plan is a function of the commit alone, so a re-run of one shard
    # runs the same files.
    name: tests (py3.11, shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # A shard is a quarter of the suite (about 12 min expected); 30 is
    # 2.5 times that. The unsharded job needed 60 on 2026-10-15 (#276)
    # after reaching 100 % at 49.5 min. Each test keeps its own 300 s
    # limit (--timeout below), so a hang still fails at once.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The verify step in `test` names the same count.
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: test_pre_refactor_api_preserved.py compares the public
          # API against a pre-refactor commit via `git show`. A shallow clone
          # lacks it -> 0 cases -> that guard test fails.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + test deps
        # numpy<2 holds this leg on the old end of the range pyproject
        # admits (1.26). The other end, numpy 2.2 on Python 3.12, is the
        # reference-environment job below; without the pin both would test
        # numpy 2 and nothing would notice a break of the 1.x line.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[agent,docs,dev]" "numpy<2"

      # A real xtb for the tests that read its results (conftest.real_xtb;
      # without one they skip). The conda-forge build, pinned to version and
      # build string: the one the unsharded job had been using without
      # declaring it -- DELFIN's automatic install, started by the first test
      # that reached optimize_with_gfn without an xtb, fetched xtb>=6.7.1
      # from conda-forge into delfin/qm_tools/.mamba_env, which resolved to
      # this build (compiled 2026-06-10). The suite no longer installs
      # anything (conftest sets DELFIN_AUTO_INSTALL_QM_TOOLS=0).
      #
      # Not the release binary slow-tests.yml uses: under pytest it returned
      # a frequency 1.055e-6 cm-1 apart between two runs of the same input on
      # 6 of 20 pairs, while this build was identical 20 of 20.
      #
      # micromamba is fetched the way the generalist job below fetches it
      # (latest, unpinned, no checksum); the package itself is pinned.
      #
      # Onto PATH through GITHUB_PATH, from the step right before the tests:
      # the test step's run line must stay exactly the project's test
      # command (verify_recipe; test_a_shard_runs_what_the_unsharded_job_ran),
      # and the only later step is the report upload.
      - name: Install xtb 6.7.1 (conda-forge, build gfortran_ha02e54d_5)
        env:
          MAMBA_ROOT_PREFIX: ${{ runner.temp }}/mamba
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | tar -xj -C "$RUNNER_TEMP" bin/micromamba
          "$RUNNER_TEMP/bin/micromamba" create -y -q -p "$RUNNER_TEMP/xtb" \
            -c conda-forge --override-channels "xtb==6.7.1=gfortran_ha02e54d_5"
          "$RUNNER_TEMP/xtb/bin/xtb" --version | grep "xtb version 6.7.1"
          echo "$RUNNER_TEMP/xtb/bin" >> "$GITHUB_PATH"

      - name: Run fast test suite (excludes heavy + order-dependent tests)
        # A per-TEST deadline, for the reason pytest-timeout is declared in
        # pyproject: without one, a single test that waits forever sits
        # there until the job's 25-minute limit cancels it, and the run
        # ends with no failure named and nothing to look at. That happened
        # on 2026-09-09 — a guard taking an exclusive lock it already held
        # deadlocked, two tests had passed, and the job was cancelled.
        #
        # The slow workflow has had this since the same lesson. 300s is far
        # above the slowest test here and still turns a hang into one named
        # failure within five minutes. --timeout-method=signal so a test
        # blocked in C code (a lock, a socket) is interrupted too.
        #
        # The shard comes in through the environment, so the command stays
        # the one to run locally (and the one delfin.agent.verify_recipe
        # reads as this project's test command). PYTEST_ADDOPTS loads
        # .github/ci/shard_plugin.py, which reports the other shards' files
        # as deselected, as -m does for slow tests, and removes both
        # variables before the first test, so no subprocess a test starts
        # inherits them.
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/ci
          PYTEST_ADDOPTS: >-
            -p shard_plugin --shard=${{ matrix.shard }}/${{ strategy.job-total }}
            --shard-report=shard-report
        run: pytest -q -m "not slow" --timeout=300 --timeout-method=signal

      - name: Keep the shard's report
        # Also after a failure: the report names what ran. overwrite, so a
        # re-run of this shard replaces its report instead of failing on
        # the name.
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-shard-${{ matrix.shard }}
          path: shard-report/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  test:
    # The required check. It runs whenever the shards ran, whatever they
    # concluded (a job whose needs failed is otherwise skipped, and a
    # skipped required check counts as passed), and fails unless every
    # shard succeeded AND their reports prove the split complete: four
    # reports for this commit, one collected suite, disjoint files, union
    # equal to the suite, every selected test finished. A missing report
    # is a failure.
    name: tests (py3.11)
    needs: test-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard succeeded
        env:
          SHARDS_RESULT: ${{ needs.test-shard.result }}
        run: |
          echo "shards: $SHARDS_RESULT"
          [ "$SHARDS_RESULT" = success ]

      - name: Checkout the check
        if: ${{ !cancelled() }}
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/ci
          persist-credentials: false

      - name: Fetch the shard reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          pattern: tests-shard-*
          path: shard-reports

      - name: The shards ran every collected test exactly once
        # Also when a shard failed, for the summary of what each one ran.
        if: ${{ !cancelled() }}
        env:
          SHA: ${{ github.sha }}
        run: python3 .github/ci/ci_shards.py verify shard-reports --shards 4 --sha "$SHA"

  container:
    # agent.bash_isolation = "container", driven for real. The fast suite
    # skips the real run where no runtime exists; here Docker and Podman
    # are installed, and DELFIN_CONTAINER_REAL turns a missing runtime or
    # image into a failure instead of a skip. One small image, pulled once.
    name: container isolation (docker, podman)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the package without its chemistry stack
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install pytest pytest-timeout

      - name: Pull the default image for both runtimes
        run: |
          docker pull docker.io/library/python:3.11-slim
          podman pull docker.io/library/python:3.11-slim

      - name: Container isolation tests
        env:
          DELFIN_CONTAINER_REAL: docker,podman
        run: >
          pytest -q -p no:cacheprovider -rs --timeout=300 --timeout-method=signal
          tests/test_a_command_can_run_in_a_container.py

  toolchains:
    # The generalist benchmark's Node/TypeScript, Rust and Go tasks,
    # validated for real. The fast suite asserts their not-run path
    # where a toolchain is missing; here node, cargo and go come from
    # conda-forge (the same channel as the operator's delfin-toolchains
    # env), and DELFIN_TOOLCHAIN_REQUIRED turns a missing toolchain into
    # a failure, so the job cannot pass by not having the tools. Every
    # fixture is dependency-free and runs offline.
    name: generalist toolchains (node, cargo, go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the package without its chemistry stack
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install pytest pytest-timeout pyyaml

      - name: Install node, rust and go from conda-forge
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | tar -xj -C "$RUNNER_TEMP" bin/micromamba
          "$RUNNER_TEMP/bin/micromamba" create -y -q -p "$RUNNER_TEMP/tc" \
            -c conda-forge "nodejs>=22.6" rust go
          echo "DELFIN_TOOLCHAIN_BIN=$RUNNER_TEMP/tc/bin" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/tc/bin/node" --version
          "$RUNNER_TEMP/tc/bin/cargo" --version
          "$RUNNER_TEMP/tc/bin/go" version

      - name: Generalist tasks against scripted solutions
        env:
          DELFIN_TOOLCHAIN_REQUIRED: "1"
          GOTOOLCHAIN: local
          GOPROXY: "off"
          CARGO_NET_OFFLINE: "true"
        run: >
          pytest -q -p no:cacheprovider -rs --timeout=900 --timeout-method=signal
          tests/test_generalist_tasks_score_the_end_state.py

  reference-env:
    name: reference environment (py3.12, numpy 2.2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The environment the published MANTA structures are built in: CPython
    # 3.12.11 with numpy 2.2.2, rdkit 2025.9.3, openbabel-wheel 3.1.1.22,
    # scipy 1.16.2 -- every version fixed by env/reference-environment.lock,
    # installed here as constraints. It answers two questions the py3.11 leg
    # cannot: does the reference file still resolve, and does the
    # construction still hold in the environment the paper data comes from.
    #
    # Not a second leg of `test`. The fast suite takes about 24.6 minutes on
    # 3.11 against a 25-minute limit, and a leg on 3.12 would sit on the same
    # edge. So this job runs the part the reference environment is about: the
    # MANTA CLI/dashboard parity, formula (every frame carries the whole
    # SMILES) and isomer-identity tests including their slow cases, and the
    # fast MANTA and user-SMILES contracts. Measured 2026-09-28 on a
    # workstation: about five minutes of tests, all passing.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.11"
          cache: pip

      - name: Install package in the reference environment
        # [pymol] is requested here although it is an optional extra: the
        # lock pins pymol-open-source 3.2.0a0 and this job is what keeps
        # every pin of the lock resolving. The runner's glibc (2.39) can
        # take the manylinux_2_35 wheel; a glibc 2.34 machine (RHEL 9)
        # installs the same command without the extra.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[agent,docs,dev,pymol]" -c env/reference-environment.lock
          python -c "import numpy, rdkit, scipy, openbabel, pymol; print('numpy', numpy.__version__, '| rdkit', rdkit.__version__, '| scipy', scipy.__version__)"

      - name: MANTA parity, formula and isomer tests (slow cases included)
        run: >
          python -m pytest -q -m "slow or not slow" --timeout=900 --timeout-method=signal
          tests/test_cli_dashboard_parity.py
          tests/test_every_frame_carries_the_whole_smiles.py
          tests/test_cli_manta.py
          tests/test_an_isomer_is_the_molecule_that_was_asked_for.py

      - name: MANTA and user-SMILES contracts (fast cases)
        run: >
          python -m pytest -q -m "not slow" --timeout=300 --timeout-method=signal
          tests/test_user_smiles_suite.py
          tests/test_user_smiles_fesc_cyclam.py
          tests/test_user_smiles_ir_ppy_acac.py
          tests/test_a_manta_setting_reaches_the_builder.py
          tests/test_the_manta_funnel_does_what_control_says.py
          tests/test_prescribed_isomer_enumerator.py
          tests/test_ci_parity.py
          tests/test_backend_parity.py

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A required check, and scoped so that a failure means something is broken.
    #
    # The rules below are the ones that describe a defect: a name that does not
    # exist, a definition silently replacing another, a duplicate dictionary
    # key, an import shadowed by a loop variable, a local used before it is
    # bound. Every one of them has already cost this project something — the
    # NameError in dashboard/__init__.py, the test in test_office_documents.py
    # that never ran because a later function took its name, the UnboundLocal
    # in the ORCA process-group cleanup that stopped it ever sending SIGKILL.
    #
    # Deliberately not gated: F401 (500), F841 (120) and F541 (117). Unused
    # imports, unused variables and f-strings without placeholders are untidy,
    # not broken, and a gate that fails on untidiness trains people to look for
    # the incantation that makes it pass. They stay visible through `ruff check
    # --select F` when anybody wants to work them down.
    #
    # ruff is pinned. Unpinned, a release that adds or widens a rule turns main
    # red for everybody without a line having changed — the same shape of
    # accident as an unbounded dependency. Raising the pin is a small, ordinary
    # pull request: bump it, see what the new version says, fix or accept.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.3

      - name: Lint for real defects
        run: |
          ruff check delfin/ tests/ \
            --select F821,F811,F601,F402,F823 \
            --output-format github

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Also reporting rather than gating, and green while it reports. A freshly
    # published advisory against a transitive dependency would otherwise mark
    # work that has nothing to do with it as failing, and DELFIN's dependency
    # tree is deep enough that this happens regularly. The findings land in the
    # run summary; the nightly schedule means one surfaces within a day even if
    # nobody pushes.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + audit tool
        run: |
          python -m pip install --upgrade pip
          pip install -e "." pip-audit

      - name: Audit installed dependencies for known advisories
        run: |
          {
            echo "### pip-audit"
            echo
            echo '```'
            pip-audit --progress-spinner off || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pip-audit --progress-spinner off || true

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Nightly and on demand, never on a push. Measuring coverage roughly
    # doubles a suite that already takes ten minutes, and the merge gate is
    # what people wait on. The question it answers — which parts of 344,000
    # lines no test reaches — does not change between one commit and the next.
    #
    # It exists because of two things this repository found the hard way: a
    # test that never ran because a later function took its name, and six of
    # nine recovery strategies that no run in the archive ever reached. Both
    # are invisible to a green suite and obvious in a coverage report.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[agent,docs,dev]"

      - name: Measure coverage over the fast suite
        run: |
          pytest -q -m "not slow" --timeout=300 --timeout-method=signal \
            --cov=delfin --cov-report=term --cov-report=xml \
            > coverage.txt 2>&1 || true
          {
            echo "### Coverage"
            echo
            echo '```'
            tail -1 coverage.txt
            echo '```'
            echo
            echo "#### Least covered modules"
            echo
            echo '```'
            grep -E '^delfin/' coverage.txt \
              | awk '{gsub("%","",$4); if ($4 != "") print $4, $1}' \
              | sort -n | head -25 \
              | awk '{printf "%5s%%  %s\n", $1, $2}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.txt
            coverage.xml
          retention-days: 30
