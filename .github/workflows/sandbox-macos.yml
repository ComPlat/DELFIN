name: Sandbox (macOS)

# The command isolation on macOS is Seatbelt, which no Linux runner can
# execute. This drives it where it runs: on changes to the sandbox and on
# demand. Informational beside CI; the tests it runs skip on Linux.
on:
  push:
    branches: [main, "agent/**"]
    paths:
      - "delfin/agent/seatbelt.py"
      - "delfin/agent/egress_proxy.py"
      - "delfin/agent/process_guard.py"
      - "delfin/agent/contained_run.py"
      - "tests/test_the_sandbox_holds_on_macos.py"
      - ".github/workflows/sandbox-macos.yml"
  workflow_dispatch:

concurrency:
  group: sandbox-macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  seatbelt:
    name: seatbelt (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[agent,dev]"

      - name: Seatbelt and containment tests
        run: >
          pytest -q -p no:cacheprovider --timeout=300 --timeout-method=signal
          tests/test_the_sandbox_holds_on_macos.py
          tests/test_a_command_ends_with_everything_it_started.py
