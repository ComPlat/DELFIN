name: Release

# From a version tag to PyPI and a GitHub release, with build provenance.
#
#   build         sdist + wheel from the tag, the tag checked against the
#                 version in pyproject.toml, exactly one of each, no
#                 third-party program or native code inside and the licence
#                 files and metadata present (scripts/check_distribution.py
#                 --release, the checker packaging.yml runs on every pull
#                 request). No token beyond contents: read.
#   sbom          a CycloneDX 1.6 JSON SBOM of what `pip install` of the
#                 built wheel puts into an empty Python 3.11 environment
#                 (cyclonedx-py environment, installed by hash from
#                 .github/ci/sbom-requirements.txt). A job of its own: the
#                 dependency install runs code from PyPI, and the build job,
#                 whose dist/ is what is published, runs none.
#   provenance    a SLSA build-provenance attestation per file
#                 (actions/attest-build-provenance) and an SBOM attestation
#                 per file (actions/attest with sbom-path), signed through
#                 Sigstore with this workflow's OIDC identity and stored in
#                 the repository: `gh attestation verify <file> -R
#                 ComPlat/DELFIN` (add `--predicate-type
#                 https://cyclonedx.org/bom` for the SBOM). Runs no project
#                 code.
#   pypi          PyPI Trusted Publishing (OIDC, no stored token) in the
#                 `pypi` environment; the publish action also uploads PEP 740
#                 attestations, which PyPI shows per file.
#   github        the same files, the SBOM and SHA256SUMS.txt on the tag's
#                 release.
#
# Only `provenance` and `pypi` can request an OIDC token (id-token: write);
# each job names its own permissions and the workflow grants nothing.
# Maintainer settings this needs are in docs/RELEASING.md: the PyPI
# trusted publisher, the `pypi` environment, and allowing
# pypa/gh-action-pypi-publish (the only action here not owned by GitHub).
#
# A dispatch builds and attests whatever ref it runs on; it publishes only
# with `publish` ticked AND a v* tag as the ref.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI and the GitHub release (the ref must be a v* tag)"
        type: boolean
        default: false

# One release per ref at a time, and never cancelled halfway: a publish
# that stops between PyPI and GitHub leaves the two disagreeing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: build (sdist, wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        # No pip cache: a release is built from what the constraints name,
        # not from a cache another workflow's run wrote.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: The tag is the version in pyproject.toml
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "tag $TAG, pyproject.toml $version"
          [ "$TAG" = "v$version" ]

      - name: Build
        # Overlap: packaging.yml (licences and packaging) also builds the
        # distributions on pull requests; this job is the one whose output
        # is published. --no-isolation: the build backend is the pinned
        # setuptools/wheel installed here, not whatever an isolated build
        # environment would fetch from PyPI at release time.
        # --require-hashes: pip, build, setuptools, wheel and their closure
        # are installed only as the bytes PyPI published when
        # .github/ci/release-requirements.txt was written (its header says
        # how to regenerate it); a substituted file of the same version
        # stops the build.
        run: |
          python -m pip install --require-hashes -r .github/ci/release-requirements.txt
          python -m build --no-isolation --sdist --wheel --outdir dist/
          ls -l dist/

      - name: The distributions are the ones a release may publish
        run: python scripts/check_distribution.py --release dist/*

      - name: Keep the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  sbom:
    name: SBOM (CycloneDX)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        # pyproject.toml names the root component; the hashed file pins the
        # generator.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Fetch the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install the SBOM generator by hash
        run: python -m pip install --require-hashes -r .github/ci/sbom-requirements.txt

      - name: Install the wheel as a user would
        # An environment without pip or setuptools of its own (--without-pip,
        # installed into from outside with --python), so the SBOM lists what
        # the wheel brings and not the installer. Dependencies resolve from
        # PyPI as for `pip install delfin-complat`.
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/released"
          python -m pip --python "$RUNNER_TEMP/released/bin/python" install dist/*.whl

      - name: Write the SBOM
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir -p sbom
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cyclonedx-py environment --pyproject pyproject.toml --mc-type library \
            --output-reproducible --of JSON \
            -o "sbom/delfin_complat-$version.cdx.json" "$RUNNER_TEMP/released/bin/python"
          python -c 'import json, sys; d = json.load(open(sys.argv[1])); print(d["specVersion"], len(d.get("components", [])), "components")' sbom/*.cdx.json

      - name: Keep the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 30

  provenance:
    name: provenance
    needs: [build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The Sigstore signing certificate is issued for this workflow's OIDC
      # identity; the attestation is stored in the repository.
      id-token: write
      attestations: write
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Fetch the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Name the SBOM
        id: sbom
        run: |
          shopt -s nullglob
          files=(sbom/*.cdx.json)
          [ "${#files[@]}" -eq 1 ]
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Attest the SBOM
        # actions/attest rather than actions/attest-sbom: the latter is a
        # deprecated wrapper around this action.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
          sbom-path: ${{ steps.sbom.outputs.path }}

  pypi:
    name: publish to PyPI
    needs: [build, provenance]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewers on this environment make a publish wait for a
    # person; the PyPI trusted publisher is bound to it by name.
    environment:
      name: pypi
      url: https://pypi.org/project/delfin-complat/
    permissions:
      id-token: write
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish (Trusted Publishing)
        # PyPA's reference implementation: exchanges the OIDC token for a
        # short-lived upload token, runs `twine check`, uploads, and signs
        # PEP 740 attestations (attestations: true is its default with
        # Trusted Publishing). Not owned by GitHub, so the repository's
        # action policy must allow this exact SHA (docs/RELEASING.md).
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github:
    name: GitHub release
    # Beside PyPI, not after it: the files are the attested ones either
    # way, and a PyPI that is not configured yet does not hold back the
    # release assets. Each job's own conclusion says which half succeeded.
    needs: [build, provenance]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Fetch the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Create the release or add the files to it
        # Never --clobber: a file already on the release is not replaced,
        # the job fails and says so.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum -- * > ../SHA256SUMS.txt)
          (cd sbom && sha256sum -- * >> ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* sbom/* SHA256SUMS.txt
          else
            gh release create "$TAG" dist/* sbom/* SHA256SUMS.txt --verify-tag --notes-from-tag --title "$TAG"
          fi
