# Reference environment of the MANTA construction: the constraints file.
#
# The dependency closure of the construction, at the exact versions the
# published MANTA structures were built with, and nothing else. Geometry
# comes out of rdkit, Open Babel and numpy, and stk's optimisers move the
# atoms, so a byte-identical rebuild is only to be expected with these.
# The named ones: numpy 2.2.2, rdkit 2025.9.3, openbabel-wheel 3.1.1.22,
# scipy 1.16.2, networkx 3.1, stk 2026.1.4.0.
#
# Use it as a constraints file, not as a requirements file:
#
#   python3.12 -m venv .venv && . .venv/bin/activate
#   pip install -e ".[agent,docs,dev]" -c env/reference-environment.lock
#
# pyproject.toml alone admits a range (numpy 1.26-2.2, rdkit 2023.3-2026.x,
# ...). A plain `pip install` on 3.12 resolves newer versions than these
# (on 2026-09-28: rdkit 2026.3.5, networkx 3.7, scipy 1.18.1).
#
# Until 2026-11-20 this file was `pip freeze --all` of the build
# interpreter: 143 pins, of which 110 are not in the closure at all.
# pip applies a constraint to any package it installs anyway, so installing
# against it held urllib3, cryptography, requests, certifi, anyio, lxml,
# pygments, setuptools, wheel and pip at the versions of that day --
# measured with pip-audit: 59 known advisories across 14 distributions,
# none of them a package that computes a coordinate. Reproducibility of the
# chemistry never needed them pinned, and CI installed them. The full
# freeze is kept as a record in env/reference-environment-interpreter.txt,
# which is not installed with.
#
# Three members of the closure are deliberately NOT pinned here, for the
# same reason: each carries a known advisory and none of them can move an
# atom. They are still installed, at whatever patched version resolution
# picks.
#   - dnspython: pymongo's SRV resolver; CVE-2026-128089
#   - fonttools: matplotlib's font parsing; CVE-2025-66034
#   - pymongo: atomlite's database driver; 5 advisories (PYSEC-2026-4294..4297, CVE-2026-106435)
#
# The pins are audited: .github/workflows/audit.yml resolves this file and
# runs pip-audit over it, so a vulnerable pin cannot come back unseen. When
# a pin here does get an advisory, the decision is made then -- raise it if
# it cannot change a structure, or record the reason in
# .github/ci/audit-ignore.txt. A pin is never left vulnerable in silence.
#
# CI installs exactly this on Python 3.12 (.github/workflows/ci.yml, job
# "reference environment"), so the file cannot silently stop resolving.
# tests/test_the_reference_lock_pins_the_closure.py holds the two
# invariants: every pin is in the closure, and the named versions are the
# published ones.
