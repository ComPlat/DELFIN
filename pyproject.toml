[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delfin-complat"
version = "1.2.0"
description = "DELFIN is a modular computational chemistry platform that automates end-to-end molecular workflows — from SMILES input to realistic property predictions. It combines structure generation, DFT, semi-empirical methods, ML potentials, and AI tools behind a unified interface with an interactive browser-based dashboard."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.12"
authors = [{ name = "Maximilian Hartmann" }]
license = {text = "LGPL-3.0-or-later"}
urls = { "Homepage" = "https://github.com/ComPlat/DELFIN", "Repository" = "https://github.com/ComPlat/DELFIN" }
keywords = ["quantum-chemistry", "orca", "xtb", "redox", "spin-state", "workflow", "dashboard", "smiles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
]
# Every entry carries an upper bound. DELFIN's results are produced by the
# numerics underneath it, so an install today and an install next year
# resolving to different majors is not a packaging detail — it decides whether
# a published number can be reproduced. The ceilings are the next major above
# what the project is known to run on, so patch and minor releases still flow
# in and only a genuine breaking release needs a person to look. Raising one is
# a deliberate step, verified against real calculations; Dependabot is
# configured not to propose it.
dependencies = [
    "mendeleev>=0.14,<1.0",
    "psutil>=5.9,<8",
    "ase>=3.22.0,<4",
    "numpy>=1.26,<2",
    "scipy>=1.6.0,<2",
    "networkx>=2.6,<4",
    "matplotlib>=3.3.4,<4",
    # rdkit versions by release year; the ceiling only rules out a jump into a
    # future year's series without anyone checking.
    #
    # 2026.3.6 is excluded, and the exclusion is dated because it is meant to
    # be removed. Same commit, two CI runs, nothing between them but a patch
    # release upstream:
    #
    #   2026-09-03 19:57  80fb85cb  push      success   rdkit 2026.3.5
    #   2026-09-04 07:56  80fb85cb  schedule  failure   rdkit 2026.3.6
    #
    # Under 2026.3.6 the isomer builder returns the metal skeleton without
    # its hydrogens — Fe(OH)7 comes back with 8 atoms instead of 15 and 0
    # hydrogens instead of 7 — so six tests in
    # test_an_isomer_is_the_molecule_that_was_asked_for.py fail. Excluding
    # the one release restores the signal; it does not fix the chemistry,
    # and the code has to be made to work with the new series before this
    # line can go.
    "rdkit>=2023.3.1,!=2026.3.6,<2027",
    "stk>=2024.1,<2027",
    "openbabel-wheel>=3.1.0,<4",
    "ipykernel>=6.0,<8",
    "ipywidgets>=8.0,<9",
    "py3Dmol>=2.0.4,<3",
    "python-docx>=0.8.11,<2",
    "pymol-open-source>=2.5,<4",
    "voila>=0.5,<0.6",
    "Pillow>=10,<13",
    # Page rendering and in-document search for the file browser's PDF
    # viewer. A dashboard feature, so it belongs with the other core
    # dashboard dependencies rather than in an extra.
    "pymupdf>=1.24,<2",
    "mammoth>=1.6,<2",
    "openpyxl>=3.1,<4",
    "pexpect>=4.8,<5",
    "umap-learn>=0.5,<0.7",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
csp = [
    "mpi4py",
]
mlp = [
    "torchani",
]
mlp-full = [
    "torchani",
    "mace-torch",
    "chgnet",
    "matgl",
    "schnetpack",
    "nequip",
    "alignn",
]
mlp-materials = [
    "chgnet",
    "matgl",
]
analysis = [
    "morfeus-ml",
    "cclib",
    "nglview",
    "plotly",
]
ai-foundation = [
    "transformers",
    "torch",
]
ai-retro = [
    "aizynthfinder",
    "rxnmapper",
]
ai-screening = [
    "deepchem",
]
ai-complex = [
    "molSimplify",
    "architector",
]
agent = [
    "anthropic>=0.40",
    "openai>=1.0",
    "pyyaml",
    # Document handling travels with the agent: the tools that need it
    # are part of its surface, and shipping the agent without them means
    # read_file refuses a spreadsheet while pointing at a tool that was
    # never advertised.
    #
    # Listed rather than pulled in as "delfin-complat[office]". The
    # self-reference reads cleaner and cost a CI run: this project is
    # published under that name, so pip resolved it against the index and
    # installed the RELEASED wheel beside the editable checkout. Imports
    # then landed partly in the wheel, and a module of the checkout
    # resolved as an empty namespace — "cannot import name ... (unknown
    # location)" in a file nobody had touched. An extra must never be able
    # to pull a published copy of the project into the environment that is
    # testing it.
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-docx>=0.8.11",
    "reportlab>=4.0",
    "formulas>=1.2",
    "odfpy>=1.4",
]
docs = [
    # The floor is the oldest release DELFIN's three MCP servers can
    # actually run on, measured rather than assumed: 1.0.0 and 1.1.0 ship
    # no server class at all, and 1.2.0's FastMCP takes no ``instructions``
    # argument, which all three pass. 1.3.0 is the first that starts and
    # answers ``tools/list``. There is deliberately no ceiling — the class
    # that 2.0.0 moved is reached through ``delfin.mcp_compat``, and both
    # lines were started and measured to advertise the same tools.
    "mcp>=1.3",
    "pypdf>=4.0",
]
# Office-document handling for the agent (read_document / edit_sheet /
# fill_pdf_form). These were previously reachable only because other
# packages happened to pull them in, so a clean install had spreadsheet
# and form support by accident or not at all. Without them the three
# tools are not advertised and the agent keeps working without them.
office = [
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-docx>=0.8.11",
    # pypdf takes PDF pages apart and puts them together but cannot lay
    # out a page, so producing a document needs a second library.
    "reportlab>=4.0",
    # Works out what a formula comes to. openpyxl stores formulas and never
    # evaluates them, so without this a cell shows =SUM(A1:A10) where a
    # spreadsheet shows the sum. Optional at runtime: missing, the grid
    # shows the formula and says why.
    "formulas>=1.2",
    # OpenDocument (.ods/.odt). LibreOffice is what a great many public
    # authorities and universities run, so these arrive as ordinary
    # attachments; without a reader they stop a document task dead.
    # Reading only — writing ODF is refused rather than approximated.
    "odfpy>=1.4",
]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    # A per-TEST deadline. The slow suite contains a call that waits on a
    # thread with no timeout of its own, and without this the whole job
    # sits behind it until the runner's limit — which is why the slow
    # tests were never run to the end and their failures went unnamed.
    # It was installed in one developer's environment and declared
    # nowhere, so the same command measured different things per machine.
    "pytest-timeout",
    "black",
    "flake8",
    "ruff",
]

[project.scripts]
delfin = "delfin.main:main"
delfin_ESD = "delfin.cli_esd_report:main"
delfin_IR = "delfin.cli_ir_report:main"
delfin_NMR = "delfin.cli_nmr_report:main"
delfin-json = "delfin.cli_delfin_collect:main"
delfin-build = "delfin.build_up_complex:main"
delfin-manta = "delfin.cli_manta:main"
delfin-guppy = "delfin.guppy_sampling:main"
delfin-guppy-batch = "delfin.guppy_batch:main"
delfin-fukui = "delfin.cli_fukui:main"
delfin-voila = "delfin.cli_voila:main"
delfin-step = "delfin.cli_step:main"
delfin-pipeline = "delfin.cli_pipeline:main"
delfin-docs-index = "delfin.doc_server.indexer:main"
delfin-tools-server = "delfin.tools.mcp_server:main"
delfin-app = "delfin.cli_app:main"
delfin-agent = "delfin.agent.cli:main"
delfin-docs-server = "delfin.doc_server.__main__:main"
delfin-ops-server = "delfin.ops_server.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["delfin*"]

[tool.setuptools.package-data]
"delfin" = [
    "installers/*.sh",
    "logo/*.png",
    "logo/*.PNG",
    # The submit tab loads MANTA_readme_demo.gif through importlib.resources
    # and falls back to an empty data URI when it is missing, so leaving the
    # animations out of the wheel loses the viewer's loading animation with
    # no error anywhere.
    "logo/*.gif",
    "qm_tools/*.txt",
    "qm_tools/*.sh",
    "qm_tools/bin/stda_v1.6.1",
    "qm_tools/bin/xtb4stda",
    "qm_tools/share/xtb4stda/*",
    "csp_tools/*.sh",
    "mlp_tools/*.sh",
    "analysis_tools/*.sh",
    "analysis_tools/*.txt",
    "ai_tools/*.sh",
    "ai_tools/*.txt",
    "submit_templates/*.sh",
]
# 3Dmol is vendored so viewers work without outbound network; leaving it
# out of the wheel silently returns every viewer to the two CDNs.
"delfin.dashboard" = ["static/*.js", "static/*.txt"]
"delfin.agent.pack" = ["**/*.md", "**/*.yaml", "skills/*.md"]
"delfin.agent.pack_lite" = ["**/*.md", "**/*.yaml"]
"delfin.notebooks" = ["*.ipynb"]
"delfin.manta" = ["*.md"]
"delfin.voila_assets" = ["login_templates/*.html"]

[tool.setuptools.exclude-package-data]
"delfin" = [
    "qm_tools/bin/crest",
    "qm_tools/bin/dftb+",
    "qm_tools/bin/std2",
    "qm_tools/bin/stda",
    "qm_tools/bin/xtb",
    "qm_tools/downloads/*",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501", # handled by black (line length)
]

[tool.ruff.lint.isort]
known-first-party = ["delfin"]
