pack_name: DELFIN_AGENT_LITE
version: 1
purpose: >
  Cost-aware orchestration presets for DELFIN. Optimized for small, bounded work
  cycles with risk-based escalation to additional agents only when justified.
depends_on:
  base_pack: DELFIN_AGENT
  base_agents_dir: ../pack/agents
  base_shared_dir: ../pack/shared
recommended_default_mode: dashboard
modes:
  - id: dashboard
    file: modes/dashboard.md
    route:
      - dashboard_agent
  - id: solo
    file: modes/solo.md
    route:
      - solo_agent
  - id: office
    file: modes/office.md
    route:
      - office_agent
  - id: research
    file: modes/research.md
    route:
      - research_agent
  # The same specialist the generalist delegates to, as a mode a person
  # can choose. ONE DEFINITION, TWO ENTRANCES: the route names the
  # subagent preset `workflow-operator`, so its prompt comes from that
  # one file (prompt_loader.load_role_prompt falls back to the preset
  # body) and its tool surface from that one `tools:` line
  # (api_client._role_allowlist derives it). Nothing about the
  # specialist is stated twice, and choosing it directly cannot be a way
  # around the restriction it carries when delegated.
  - id: workflow
    file: modes/workflow.md
    route:
      - workflow-operator
  # The lab specialist, declared the same way and for the same reason: the
  # route names the PRESET, so its prompt and its tool surface each come
  # from that one file. Deliberately NOT in _SINGLE_AGENT_MODES or
  # _LAUNCH_INDEPENDENT_MODES (delfin/dashboard/tab_agent.py) -- those are
  # in the self-modification guard's protected set, and a mode reaches them
  # through a patch (scratch/lab-run-dispatch.patch) that must be applied
  # before the dashboard offers it. Until then the mode is reachable from
  # the CLI and by delegation, and the dashboard's picker falls back.
  - id: lab
    file: modes/lab.md
    route:
      - lab-specialist

