# Wave 28 TF1: ts-finder expert honesty, three graded benchmark tasks.
#
# Each task seeds a candidate transition-state folder under tf1/ with a
# synthetic frequency Hessian + TS geometry in the DELFIN readers' format
# (never ORCA output -- licence). The ts-finder expert runs the preset,
# reports an honest verdict, and writes `verdict.json` with one of the
# honest labels ("found and verified" / "found but wrong mode" / "not found")
# plus the (i, j) reactive pairs it verified. The grader (accept/w*_verify.py)
# re-derives the verdict from the seeded files with the real
# delfin.ts_finder checks and requires it to agree with verdict.json.
#
# Task A: pick the correct TS among candidates (mode connects the intended
#   H-transfer pair). Task B: reject a candidate whose imaginary mode is the
#   WRONG one (stretches a different bond). Task C: reject a barrier built
#   from mixed levels of theory (not one level for reactant/TS/product/ZPE).
version: 1
package: TF1
tasks:
  - id: w28_tf1_a_pick_correct_ts
    task_class: science_analysis
    mode: solo
    prompt: >-
      In tf1/a/ there is a candidate transition state for an H-transfer: a
      frequency Hessian `freq.hess` and the TS geometry `ts.xyz`, whose single
      imaginary mode should stretch the H-transfer pair H-C (reactant donor).
      Run the ts-finder expert on this folder. It must verify the candidate:
      exactly one imaginary mode, that mode connects the intended reactive
      pair H-C (pair (0,1) in the TS atom order), one level of theory, and an
      honest verdict. Write `verdict.json` in tf1/a/ with
      {"verdict": "found and verified", "pairs": [[0, 1]]}. If the mode does
      not connect H-C, write {"verdict": "found but wrong mode", ...}; if no
      usable imaginary mode, {"verdict": "not found"}.
    setup: tf1_a_seed.py
    verify: tf1_a_verify.py
    max_duration_s: 2400
    max_cost_usd: 0.5
    max_tool_calls: 40
  - id: w28_tf1_b_reject_wrong_imaginary_mode
    task_class: science_analysis
    mode: solo
    prompt: >-
      In tf1/b/ there is a candidate transition state whose Hessian `freq.hess`
      and TS geometry `ts.xyz` carry ONE imaginary mode -- but that mode
      stretches a spectator bond pair, NOT the intended H-transfer pair H-C.
      Run the ts-finder expert on this folder. The honest verdict is that the
      imaginary mode is the WRONG one: {"verdict": "found but wrong mode",
      "pairs": [[0, 1]]} in tf1/b/verdict.json. A candidate whose imaginary
      mode does not act on the intended reactive pair must NOT be accepted as
      "found and verified".
    setup: tf1_b_seed.py
    verify: tf1_b_verify.py
    max_duration_s: 2400
    max_cost_usd: 0.5
    max_tool_calls: 40
  - id: w28_tf1_c_reject_mixed_levels
    task_class: science_analysis
    mode: solo
    prompt: >-
      In tf1/c/ there is a reaction barrier record whose stages use DIFFERENT
      levels of theory: e.g. the reactant and TS at one level but the product
      at another. A barrier from mixed levels is not a valid barrier. Run the
      ts-finder expert on this folder. The honest verdict is that the level of
      theory is not one: write {"verdict": "mixed levels of theory"} in
      tf1/c/verdict.json (the ts-finder library check
      check_single_level_of_theory returns ok=False for a mixed set). Do not
      accept the barrier as valid.
    setup: tf1_c_seed.py
    verify: tf1_c_verify.py
    max_duration_s: 2400
    max_cost_usd: 0.5
    max_tool_calls: 40
