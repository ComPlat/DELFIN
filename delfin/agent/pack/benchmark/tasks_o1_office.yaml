    mode: office
    setup: o1_office_fixtures.py
    verify: o1_office_accept.py
    prompt: >-
      In o1/pdf_tabelle/stunden.pdf steht eine Stundenliste über zwei
      Seiten. Übernimm die Tabelle nach Excel, mit einer Kopfzeile und einer
      Zahlen-Spalte für die Stunden. Was nicht in die Tabelle gehört, steht
      in o1/pdf_tabelle/HINWEISE.txt. Ergebnis:
      o1/pdf_tabelle/stunden.xlsx.
    prompt_en: >-
      o1/pdf_tabelle/stunden.pdf holds an hours list over two pages. Move
      the table into a spreadsheet, with one header row and the hours as a
      numeric column. What does not belong in the table is stated in
      o1/pdf_tabelle/HINWEISE.txt. Result: o1/pdf_tabelle/stunden.xlsx.
