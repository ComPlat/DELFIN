      Werten seiner Zeile. Ablage und Dateinamen stehen in
      o1/formular/HINWEISE.txt.
    prompt_en: >-
      o1/formular/ holds the form antrag.pdf and the table antraege.csv.
      Fill one copy of the form per application with that row's values. The
      folder and file names are in o1/formular/HINWEISE.txt.
