      der Vorlage, mit allen Platzhaltern ersetzt. Ablage und Dateinamen
      stehen in o1/serienbrief/HINWEISE.txt.
    prompt_en: >-
      o1/serienbrief/ holds the template vorlage.docx and the list
      teilnehmer.xlsx. Produce one letter per row of the list, following
      the template, with every placeholder replaced. The folder and file
      names are in o1/serienbrief/HINWEISE.txt.
    max_duration_s: 900
    max_cost_usd: 1.50
    max_tool_calls: 40

  - id: o1_solo_serienbrief
    task_class: office_solo
    mode: solo
    setup: o1_office_fixtures.py
    verify: o1_office_accept.py
    prompt: >-
      In o1/serienbrief/ liegt die Vorlage vorlage.docx und die Liste
      teilnehmer.xlsx. Erzeuge für jede Zeile der Liste einen Brief nach
