    max_duration_s: 600
    max_cost_usd: 1.00
    max_tool_calls: 30

  # ── a mail merge into .docx letters ────────────────────────────────────
  - id: o1_office_serienbrief
    task_class: office
    mode: office
    setup: o1_office_fixtures.py
    verify: o1_office_accept.py
    prompt: >-
      In o1/serienbrief/ liegt die Vorlage vorlage.docx und die Liste
