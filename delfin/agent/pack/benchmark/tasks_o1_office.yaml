      stehen in o1/serienbrief/HINWEISE.txt.
    max_duration_s: 900
    max_cost_usd: 1.50
    max_tool_calls: 40

  # ── fill a PDF form from a table row ───────────────────────────────────
  - id: o1_office_formular
    task_class: office
    mode: office
    setup: o1_office_fixtures.py
    verify: o1_office_accept.py
    prompt: >-
      In o1/formular/ liegt das Formular antrag.pdf und die Tabelle
