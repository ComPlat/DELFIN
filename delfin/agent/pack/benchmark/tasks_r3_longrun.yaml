    decisions:
      - label: no-cache-nuke
        text: "never clear the cache on every call to dodge the bug"
        late_probe: confirm the cache still caches after the fix
    refusals: []
    expected_turns: 45
    min_compactions: 1
    thresholds:
      facts_total_min: 1
      recall_late_min: 1.0
      turns_min: 40
      redone_work_max: 2
      repeated_failing_calls_max: 2
      unproductive_loops_max: 2

