# --- chem family --------------------------------------------------------------

- id: r3long-chem-control-fill
  task_class: long_horizon
  mode: solo
  max_tool_calls: 120
  max_duration_s: 14400
  max_cost_usd: 2.00
  setup: r3long_setup.py
  verify: r3long_accept.py
  prompt: >-
    In r3long/chem/control-fill/ there is a CONTROL template with
    placeholders, plan.txt with the values to fill in, and a synthetic
    input structure. Fill every placeholder from plan.txt and write
    filled_control.txt, then write summary.md as README.txt asks. This
    is a dry-run task: validate the filled CONTROL text yourself; no
    computational binary is needed or expected. Keep facts.txt binding;
    late in the run you will be asked to restate it. Work over many
    turns: re-check each substituted key against plan.txt before you
    finish.
  lh_:
    planted_facts:
      - label: stage-fixed
        text: "the template's STAGE=OPT line must not change"
        must_be_exact: true
        late_probe: restate which line of the template must not change
    decisions:
      - label: no-invented-values
        text: "never invent a placeholder value that plan.txt does not give"
        late_probe: confirm every filled value came from plan.txt
    refusals: []
    expected_turns: 42
    min_compactions: 1
    thresholds:
      facts_total_min: 1
      recall_late_min: 1.0
      turns_min: 40
      redone_work_max: 2
      repeated_failing_calls_max: 2
      unproductive_loops_max: 2

