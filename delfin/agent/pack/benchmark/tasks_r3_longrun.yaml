# R3 long-task benchmark suite (package R3): TEN long tasks, three
# families (code / chem / data).
#
# Conventions follow tasks_w17_longrun.yaml (task shape, setup/verify
# scripts, mid_run_messages) and tasks_w28_lh.yaml (the `lh_` metadata
# block: planted_facts / decisions / refusals / thresholds). The Task
# loader (`delfin/agent/benchmark.py::_coerce_task`) drops unknown keys,
# so the `lh_` blocks are carried for the F2 runner
# (`delfin/agent/longhorizon/runner.py`), which re-parses this file and
# grades thresholds -- including the package-R3 bounds
# `repeated_failing_calls_max` and `unproductive_loops_max` (see
# runner._grade).
#
# Every task is `task_class: long_horizon`, solo, max_tool_calls >= 120
# and max_duration_s >= 14400, with `turns_min >= 40` -- the "40+ steps"
# property is asserted by tests/test_r3_longrun_tasks.py, not assumed.
#
# No fixture holds real ORCA/xtb output data: the fixtures are synthetic
# text the setup script (r3long_setup.py) writes. `r3long-absent-binary`
# states in its README that the needed binary is absent on purpose; its
# objective checks are that no success result file is written and the
# final message names the install step (rubric criterion
# `names_install_step`, kind: signals).

# --- code family --------------------------------------------------------------

- id: r3long-code-median
  task_class: long_horizon
  mode: solo
  max_tool_calls: 160
  max_duration_s: 14400
  max_cost_usd: 2.00
  setup: r3long_setup.py
  verify: r3long_accept.py
  prompt: >-
    In r3long/code/median/ there is a small python package whose test
    suite fails because stats_core.median is wrong for even-length
    samples. Find the cause, fix it in the module (not in the test),
    run the package's tests, and write fix_note.md as README.txt asks.
    Keep the planted facts in facts.txt binding for the whole run; late
    in the run you will be asked to restate them. Work thoroughly and
    over many turns: verify the fix against every test, re-check the
    reported values, and do not loop on the same failing call.
  lh_:
    planted_facts:
      - label: fix-scope
        text: "the fix must change stats_core.py; the failing test stays as it is"
        must_be_exact: true
        late_probe: restate which module may change and which file may not
    decisions:
      - label: test-untouched
        text: "never make the test weaker to make it pass"
        late_probe: confirm the failing test was not weakened
    refusals: []
    expected_turns: 45
    min_compactions: 1
    thresholds:
      facts_total_min: 1
      recall_late_min: 1.0
      turns_min: 40
      redone_work_max: 2
      repeated_failing_calls_max: 2
      unproductive_loops_max: 2

