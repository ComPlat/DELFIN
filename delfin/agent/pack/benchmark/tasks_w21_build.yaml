      the calculations; the workflow is the deliverable.
    setup: w21_build_fixtures.py
    verify: w21_build_verify.py
    grading_levels: [consistency, reproduction, trap]
    trap: an unverified stationary point is not a transition state
    max_duration_s: 600
    max_cost_usd: 0.50
    max_tool_calls: 25

