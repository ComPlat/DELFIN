      spec.json in the task folder and explain your choices in
      answer.txt. Do not run the calculations; the workflow is the
      deliverable.
    setup: w21_build_fixtures.py
    verify: w21_build_verify.py
    grading_levels: [consistency, reproduction]
    max_duration_s: 600
    max_cost_usd: 0.50
    max_tool_calls: 25

  - id: w21_build_spectrum
