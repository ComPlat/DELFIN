# Wave-21 workflow-BUILDING tasks (package WB0, builder nacht-s20).
#
# The agent's deliverable is a DELFIN pipeline spec (spec.json) plus an
# answer.txt justifying every deviation from the defaults. No calculation
# is graded by the acceptance script: workflow_grader.grade() judges the
# spec against the chemist's brief (delfin/agent/workflow_grader.py).
# Prompts read like a chemist's request and name no workflow, template or
# step vocabulary.
#
# task_class science_analysis: the tasks WRITE a spec file in the
# workspace (routed to tests/fixtures/science_workspace by
# benchmark_runner.workspace_for) and are graded on validate_spec, not on
# the cheap-xtb physics bands the "chemistry" class carries
# (tests/test_chemistry_is_graded_on_the_physics.py forbids orca signals
# there).
#
# cost block is a PLACEHOLDER like the w20 files: the real-run tasks
# (phase 3) report core-hours through EF1's
# delfin/agent/cluster_efficiency.account after the run.

tasks:

  - id: w21_build_conformers
    task_class: science_analysis
    mode: solo
    prompt: >-
      In w21_build_conformers/ you find start.xyz (ethanol) and
      brief.txt. Build me a DELFIN workflow for what the brief asks —
      write it as spec.json in the task folder and explain your choices
      in answer.txt. Do not run the calculations; the workflow is the
      deliverable.
    setup: w21_build_fixtures.py
    verify: w21_build_verify.py
    grading_levels: [consistency, reproduction]
    max_duration_s: 600
    max_cost_usd: 0.50
    max_tool_calls: 25

