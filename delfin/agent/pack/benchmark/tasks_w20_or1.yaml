# W20 OR1: transition-state tasks (nacht-s14, package OR1).
#
# Five tasks, tiny systems only (<= 20 atoms, <= 3 heavy atoms mostly),
# each graded on the PHYSICS its artifact carries, in the chem_*
# pattern (tasks_chem.yaml): an acceptance script re-derives the
# verdict from the artifact the run left behind, and the prose is
# additionally judged on the values it states (expected_values bands).
#
# Grading invariants per task:
#  - the "TS" carries exactly one imaginary mode (a trap task with two
#    must be REFUSED, never graded as a pass);
#  - the IRC endpoints are the stated minima;
#  - the barrier is quoted within a literature band, at ONE level of
#    theory, with ZPE from the same level.
#
# Literature bands (cited, marked as bands, not single numbers):
#  - HCN <-> HNC isomerisation barrier (TS relative to HCN): ~48-50
#    kcal/mol at correlated levels (e.g. ~48.6 kcal/mol, cc-pVTZ
#    quality; sources: E. Herbst, and later CCSD(T) studies). Band
#    used below: 45-53 kcal/mol, flagged as an estimate band for
#    grading only.
#  - SN2 identity F- + CH3F -> FCH3 + F-: symmetric, single barrier
#    ~15-17 kcal/mol in gas phase at correlated levels (sources:
#    photo detachment / ab initio studies). Band used: 12-20.
#
# Offline grading: the acceptance scripts run through DELFIN's own
# adapters with a mocked run layer where no compute is available, and
# through the real runner on a compute node (DELFIN_CHEM_SLURM=1).

tasks:

  # ── TS task: the HCN <-> HNC isomerisation ────────────────────────────
  - id: or1_hcn_hnc_ts_and_irc
    task_class: chemistry
    mode: solo
    prompt: >-
      In chem/hcn_hnc/ are start.xyz (linear HCN, the more stable
      isomer) and hnc_guess.xyz (linear HNC). Find the transition
      state of the HCN <-> HNC hydrogen-transfer isomerisation with
      DELFIN's orca_ts_opt (OptTS, state your hessian_mode), verify it
      with orca_ts_freq_check (exactly one imaginary mode, moving along
      the H-transfer coordinate), run orca_ts_irc in both directions
      from the TS, re-optimise both IRC endpoints and confirm they are
      the two isomers. Report the barrier in kcal/mol relative to HCN
      at ONE level of theory, with the ZPE correction from the same
      level, and compare against the literature band 45-53 kcal/mol
      (cited). Everything through DELFIN's steps; state the level used.
    setup: w20_or1_seed.py
    verify: w20_or1_ts_hcn_verify.py
    expected_signals:
      - pattern: '(?i)barrier (is|of|height)'
        against: text
      - pattern: '(?i)(orca_ts_opt|hessian_mode)'
        against: text
      - pattern: '(?i)(imaginary|imag)'
        against: text
      - pattern: '(?i)(kcal)'
        against: text
    forbidden_signals:
      # Two imaginary modes means the structure is NOT a TS; calling
      # it one is the failure mode this suite exists to catch.
      - pattern: '(?i)(two|2|second)\s+(imaginary|imag)'
        against: text
    max_duration_s: 1800
    max_cost_usd: 2.00
    max_tool_calls: 40

  # ── scan task: methyl rotation in ethane ──────────────────────────────
  - id: or1_ethane_methyl_rotation_scan
    task_class: chemistry
    mode: solo
    prompt: >-
      In chem/ethane/ there is start.xyz of ethane. Set up a relaxed
      dihedral scan of the H-C-C-H torsion through 360 degrees
      (ORCA %geom constraint scan, through DELFIN's adapters with the
      constraint in the input), report the barrier for the eclipsed
      conformation in kcal/mol relative to staggered, and state the
      level of theory. Pre-optimise with xtb_opt first (cheap-first),
      final level stated.
    setup: w20_or1_seed.py
    verify: w20_or1_scan_ethane_verify.py
    expected_signals:
      - pattern: '(?i)barrier (is|of|height)'
        against: text
      - pattern: '(?i)(xtb)'
        against: any
      - pattern: '(?i)(scan|constraint)'
        against: text
      - pattern: '(?i)(kcal)'
        against: text
    expected_values:
      # Ethane rotational barrier: experimental ~2.9 kcal/mol (well
      # known); xTB and DFT both land in 2.5-3.2. Wide band, grading only.
      - label: ethane_rotation_barrier_kcal
        value: 2.9
        tolerance: 0.6
        against: text
    max_duration_s: 1200
    max_cost_usd: 1.00
    max_tool_calls: 30

  # ── SN2 identity reaction: symmetric TS ───────────────────────────────
  - id: or1_sn2_identity_barrier
    task_class: chemistry
    mode: solo
    prompt: >-
      In chem/sn2/ are start.xyz (CH3F) and f_anion.xyz (F-, charge
      -1). Find the symmetric TS of the identity SN2 reaction
      F- + CH3F -> FCH3 + F- with DELFIN's orca_ts_opt, verify exactly
      one imaginary mode with orca_ts_freq_check (it must be the C-F
      stretching coordinate), and report the barrier in kcal/mol
      relative to separated reactants at one level with ZPE same
      level; literature band 12-20 kcal/mol (cited).
    setup: w20_or1_seed.py
    verify: w20_or1_ts_sn2_verify.py
    expected_signals:
      - pattern: '(?i)barrier (is|of|height)'
        against: text
      - pattern: '(?i)(orca_ts_opt|hessian_mode)'
        against: text
      - pattern: '(?i)(imaginary|imag)'
        against: text
    expected_values:
      - label: sn2_barrier_kcal
        value: 15.0
        tolerance: 4.0
        against: text
    max_duration_s: 1800
    max_cost_usd: 2.00
    max_tool_calls: 40

  # ── verification-only task: judge a given TS candidate ────────────────
  - id: or1_ts_candidate_verdict
    task_class: chemistry
    mode: solo
    prompt: >-
      In chem/ts_candidate/ there is ts_candidate.xyz, a candidate
      transition state from a previous run. Run orca_ts_freq_check on
      it at a stated level and report the verdict: is it a transition
      state (exactly one imaginary mode, moving along the stated
      coordinate) or not? Report n_imag and the imaginary frequency in
      cm-1 as printed (negative). Do NOT call it a TS unless the
      verdict is a real TS.
    setup: w20_or1_seed.py
    verify: w20_or1_ts_verdict_verify.py
    expected_signals:
      - pattern: '(?i)(orca_ts_freq_check|n_imag)'
        against: text
      - pattern: '(?i)(cm.?-?1|cm\*\*-1)'
        against: text
    max_duration_s: 900
    max_cost_usd: 1.00
    max_tool_calls: 20

  # ── the trap: a two-imaginary-mode "TS" must be refused ───────────────
  - id: or1_two_imaginary_trap_refused
    task_class: chemistry
    mode: solo
    prompt: >-
      In chem/trap_ts/ there is ts_trap.xyz, which a colleague calls
      "the transition state". Verify it with orca_ts_freq_check at a
      stated level. If it is not a TS (for example two imaginary
      modes), say so plainly and DO NOT report a barrier for it; state
      what you would do next instead (displace along the spurious mode
      and re-optimise). Never hide the mode count.
    setup: w20_or1_trap_seed.py
    verify: w20_or1_trap_verify.py
    expected_signals:
      - pattern: '(?i)(not a (true |valid )?(transition state|ts)|two imaginary|2 imaginary|second imaginary|higher.order)'
        against: text
      - pattern: '(?i)(imaginary|n_imag)'
        against: text
    forbidden_signals:
      # A barrier for a structure that is not a TS.
      - pattern: '(?i)(barrier (is|of|=)\s*[0-9])'
        against: text
    max_duration_s: 900
    max_cost_usd: 1.00
    max_tool_calls: 20
