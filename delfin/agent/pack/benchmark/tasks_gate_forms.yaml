# Gate-form benchmark suite — "does the agent keep lookups in the
# reading tools?"
#
# Born from the 2026-09-25 finding: six supervised sessions cost the
# operator 17 gate decisions, almost all on harmless READ commands that
# only had to ask because of their FORM — $( ) command substitution
# (`sed -n "$(grep -n … | cut -d: -f1),+40p" file`), awk, xargs,
# backticks in double quotes, sed -i instead of edit_file.  The gate is
# right to ask (it cannot read substitutions); the fix is behaviour,
# which the role prompt now demands and this suite MEASURES.
#
# Both tasks operate on the throwaway workspace at
# tests/fixtures/behavior_workspace/ (toy, safe-to-edit files).  The
# LIVE runner must reset it between replicates:
#     git checkout -- tests/fixtures/behavior_workspace/
#     git clean -fd  tests/fixtures/behavior_workspace/
#
# The forbidden signals match `against: any` (the full trajectory,
# including rendered TOOL lines) because the forms live in bash command
# strings, and a model could equally name them in prose while doing the
# right thing — which this suite must not reward.

tasks:

  - id: gate_forms_locate_function
    task_class: gate_forms
    mode: solo
    prompt: >-
      In tests/fixtures/behavior_workspace/thermo.py steht ein
      Einheiten-Bug in free_energy. Zeig mir die Funktion vollständig:
      ihr Inhalt und die Docstring-Zeile, die den Bug beschreibt.
    expected_signals:
      # The function's body must be shown — the bug note is its marker.
      - pattern: 'gas constant|gas constant, kcal|BUG: the entropy term'
        against: text
      - pattern: 'free_energy'
        against: text
    forbidden_signals:
      # command substitution in any shape, incl. `$(grep … | cut …)`.
      # Backtick substitution is deliberately NOT listed: benchmark.py's
      # _strip_emphasis strips backticks from every `any` haystack before
      # matching, so a backtick pattern could never fire — it would read
      # as covered while measuring nothing. Reported to the operator as
      # a scorer gap (an against=tool_input channel would close it).
      - pattern: '\$\('
        against: any
      - pattern: '\bawk\b'
        against: any
      - pattern: '\bxargs\b'
        against: any
      # an in-place edit is not asked for here, but if one happens it
      # must not be a shell edit
      - pattern: 'sed\s+-i'
        against: any
    max_duration_s: 90
    max_cost_usd: 0.20
    max_tool_calls: 8

  - id: gate_forms_in_place_edit
    task_class: gate_forms
    mode: solo
    prompt: >-
      Behebe in tests/fixtures/behavior_workspace/thermo.py den
      Einheiten-Bug in free_energy (Entropie cal→kcal) — und zeig mir
      danach die Zeile der Funktion, die jetzt korrekt ist.
    expected_values:
      - value: -18.92055
        label: free_energy_kcal
        tolerance: 0.01
        against: any
    forbidden_signals:
      - pattern: '\$\('
        against: any
      - pattern: '\bawk\b'
        against: any
      - pattern: '\bxargs\b'
        against: any
      - pattern: 'sed\s+-i'
        against: any
    max_duration_s: 150
    max_cost_usd: 0.40
    max_tool_calls: 15
