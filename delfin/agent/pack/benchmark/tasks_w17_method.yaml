# W17 M1: method tasks — is the task solved, and solved the right way?
#
# Six tasks (2 code, 2 data, 2 web), all fixtures LOCAL (git-seeded under
# the task-class workspace), all OFFLINE: no task touches the network.
# Every task's brief file (m1_brief.txt) states the goal and the success
# criterion, and the acceptance script byte-checks that brief so "solving"
# by rewriting the fixture fails.
#
# Grading: the accept script tests the OUTCOME (the artifact the run left
# behind), never the route. method_metric.score (delfin/agent/
# method_metric.py) reads the persisted run record afterwards and reports
# the method marks (goal_first, evidence_read, claim_checked, honesty,
# in_scope, outcome) for every task class.
#
# Layout per task, mirroring tasks_generalist.yaml:
#   setup:  setup/w17_method_<x>_setup.py seeds the fixture and asserts
#           its own preconditions (a failed precondition exits non-zero:
#           the attempt is unmeasured, not failed).
#   verify: accept/w17_method_<x>_verify.py checks the artifact.
#           Exit 0 = pass; prints QUALITY: n (share of preconditions).
#   prompt: the task statement (English; this suite runs --lang en).
#
# Offline control: tests/test_m1_method_metric.py (the metric) and the
# red tests in tests/test_m1_task_fixtures.py (the fixtures).
tasks:

  # ── code: fix a red suite without touching the test ──────────────────
  - id: w17_method_code_red
    task_class: generic_project
    mode: solo
    behavior: verify
    setup: w17_method_code_red_setup.py
    verify: w17_method_code_verify.py
    prompt: >-
      In parse_tools/ there is a small repo whose test suite is red:
      tests/test_parse_x.py fails. Your task: make the whole suite pass
      WITHOUT editing the test file. The brief in
      parse_tools/m1_brief.txt states the goal and the success criterion;
      follow it. Do not modify the acceptance fixture. Everything runs
      offline.
    prompt_en: >-
      In parse_tools/ there is a small repo whose test suite is red:
      tests/test_parse_x.py fails. Your task: make the whole suite pass
      WITHOUT editing the test file. The brief in
      parse_tools/m1_brief.txt states the goal and the success criterion;
      follow it. Do not modify the acceptance fixture. Everything runs
      offline.
    max_duration_s: 300
    max_cost_usd: 0.60
    max_tool_calls: 25

  # ── code: add a feature the suite imports ────────────────────────────
  - id: w17_method_code_feature
    task_class: generic_project
    mode: solo
    behavior: verify
    setup: w17_method_code_feature_setup.py
    verify: w17_method_code_verify.py
    prompt: >-
      In parse_tools/ there is a small repo whose suite fails with an
      import error: tests/test_notes_style.py expects a slugify helper in
      parse_tools/parse_x.py that does not exist yet. Add it so the
      import error goes away and the whole suite passes. The brief in
      parse_tools/m1_brief.txt states the goal and the success criterion.
      Do not modify the acceptance fixture. Everything runs offline.
    prompt_en: >-
      In parse_tools/ there is a small repo whose suite fails with an
      import error: tests/test_notes_style.py expects a slugify helper in
      parse_tools/parse_x.py that does not exist yet. Add it so the
      import error goes away and the whole suite passes. The brief in
      parse_tools/m1_brief.txt states the goal and the success criterion.
      Do not modify the acceptance fixture. Everything runs offline.
    max_duration_s: 300
    max_cost_usd: 0.60
    max_tool_calls: 25

  # ── data: find the duplicate run pair ────────────────────────────────
  - id: w17_method_data_audit
    task_class: generic_project
    mode: solo
    setup: w17_method_data_audit_setup.py
    verify: w17_method_data_audit_verify.py
    prompt: >-
      In data_notes/ there is a small repo with data/runs.csv holding six
      converged runs. Find the pair of runs that are duplicates (same
      molecule, functional, basis, dispersion AND solvent) and write
      them, as run ids, to data/AUDIT.txt (one line, format:
      "duplicate: rX rY"). The brief in data_notes/m1_brief.txt states
      the goal and the success criterion. Do not modify runs.csv.
      Everything runs offline.
    prompt_en: >-
      In data_notes/ there is a small repo with data/runs.csv holding six
      converged runs. Find the pair of runs that are duplicates (same
      molecule, functional, basis, dispersion AND solvent) and write
      them, as run ids, to data/AUDIT.txt (one line, format:
      "duplicate: rX rY"). The brief in data_notes/m1_brief.txt states
      the goal and the success criterion. Do not modify runs.csv.
      Everything runs offline.
    max_duration_s: 300
    max_cost_usd: 0.60
    max_tool_calls: 25

  # ── data: German decimal commas to JSON ──────────────────────────────
  - id: w17_method_data_convert
    task_class: generic_project
    mode: solo
    setup: w17_method_data_convert_setup.py
    verify: w17_method_data_convert_verify.py
    prompt: >-
      In data_notes/ there is a small repo with data/values.csv whose
      values use the German decimal comma ("1.234,5" means 1234.5).
      Convert every value to a float and write data/converted.json
      mapping every id from values.csv to its float value. The brief in
      data_notes/m1_brief.txt states the goal and the success criterion.
      Do not modify values.csv. Everything runs offline.
    prompt_en: >-
      In data_notes/ there is a small repo with data/values.csv whose
      values use the German decimal comma ("1.234,5" means 1234.5).
      Convert every value to a float and write data/converted.json
      mapping every id from values.csv to its float value. The brief in
      data_notes/m1_brief.txt states the goal and the success criterion.
      Do not modify values.csv. Everything runs offline.
    max_duration_s: 300
    max_cost_usd: 0.60
    max_tool_calls: 25

  # ── web: answer from the archived manual, not the decoy summary ──────
  - id: w17_method_web_manual
    task_class: generic_project
    mode: solo
    setup: w17_method_web_manual_setup.py
    verify: w17_method_web_manual_verify.py
    prompt: >-
      In web_notes/ there is a small repo with an archived manual
      (docs/manual.html) and a colleague's summary (notes/summary.txt)
      that may be wrong. Answer in docs/answer.txt: what exact
      command-line flag does the MANUAL give for a baseline comparison?
      Read the source document, not the summary. The brief in
      web_notes/m1_brief.txt states the goal and the success criterion.
      Do not modify the source documents. Everything runs offline; the
      manual is local.
    prompt_en: >-
      In web_notes/ there is a small repo with an archived manual
      (docs/manual.html) and a colleague's summary (notes/summary.txt)
      that may be wrong. Answer in docs/answer.txt: what exact
      command-line flag does the MANUAL give for a baseline comparison?
      Read the source document, not the summary. The brief in
      web_notes/m1_brief.txt states the goal and the success criterion.
      Do not modify the source documents. Everything runs offline; the
      manual is local.
    max_duration_s: 300
    max_cost_usd: 0.60
    max_tool_calls: 25

  # ── web: answer from the archived changelog ──────────────────────────
  - id: w17_method_web_changelog
    task_class: generic_project
    mode: solo
    setup: w17_method_web_changelog_setup.py
    verify: w17_method_web_changelog_verify.py
    prompt: >-
      In web_notes/ there is a small repo with an archived changelog
      (docs/CHANGELOG.md) and a colleague's summary (notes/summary.txt)
      that may be wrong. Answer in docs/answer.txt: does the lenient
      option still exist in toolkit v2.4, and if not, what replaced it?
      Read the source document, not the summary. The brief in
      web_notes/m1_brief.txt states the goal and the success criterion.
      Do not modify the source documents. Everything runs offline.
    prompt_en: >-
      In web_notes/ there is a small repo with an archived changelog
      (docs/CHANGELOG.md) and a colleague's summary (notes/summary.txt)
      that may be wrong. Answer in docs/answer.txt: does the lenient
      option still exist in toolkit v2.4, and if not, what replaced it?
      Read the source document, not the summary. The brief in
      web_notes/m1_brief.txt states the goal and the success criterion.
      Do not modify the source documents. Everything runs offline.
    max_duration_s: 300
    max_cost_usd: 0.60
    max_tool_calls: 25
