    position: P2
    "from": synthesis
    after: [stir-off-2]
  - id: to-column-3
    op: transfer
    sample: S-003
    to: purification
    position: P3
    "from": synthesis
    after: [stir-off-3]
  - id: to-column-4
    op: transfer
    sample: S-004
    to: purification
    position: P4
    "from": synthesis
    after: [stir-off-4]
  - id: valve-open-1
    op: set
    device: column_valve_1
    channel: power
    value: "on"
    after: [to-column-1]
  - id: purge-1
    op: set
    device: column_pump_1
    channel: flow
    value: 2
    unit: mL/min
    after: [valve-open-1]
  - id: purge-hold-1
    op: hold
    seconds: 30
    after: [purge-1]
  - id: purge-off-1
    op: set
    device: column_pump_1
    channel: flow
    value: 0
    unit: mL/min
    after: [purge-hold-1]
  - id: valve-close-1
    op: set
    device: column_valve_1
    channel: power
    value: "off"
    after: [purge-off-1]
