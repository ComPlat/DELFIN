# A four-sample campaign through a ChemASAP-shaped platform, in the simulator.
#
# Companion to `chemasap_campaign.yaml` (the manifest with the devices, units,
# ranges, interlocks and approval levels). Copy that manifest to
# <lab_dir>/manifest.yaml, keep this file anywhere you like, then:
#
#   delfin-agent lab manifest pin
#   delfin-agent lab run chemasap_campaign_workflow.yaml --parallel 4
#
# Each of the four samples occupies one lane: storage drawer -> reactor ->
# purification column -> rack position. Lanes share no device except the fume
# hood, which is switched on once before any heating starts. So --parallel 4
# runs the whole campaign in about the time of one lane, and the sequential
# default runs exactly the same steps in document order.
#
# The hazardous writes (each reactor's setpoint above 40 degC, each column's
# timed purge) pause the run at `waiting_approval` until a person approves
# them: `lab approve <id>`, one grant per action, then the same command with
# `--resume`. There is no plan-wide pre-approval: an agent session may not
# grant one, and the CLI has no flag that would.
id: chemasap-campaign
samples:
  S-001:
    container: vial-1
    module: storage
    position: ST1
  S-002:
    container: vial-2
    module: storage
    position: ST2
  S-003:
    container: vial-3
    module: storage
    position: ST3
  S-004:
    container: vial-4
    module: storage
    position: ST4
steps:
  - id: drawer-open-1
    op: set
    device: storage_drawer_1
    channel: power
    value: "open"
  - id: drawer-open-2
    op: set
    device: storage_drawer_2
    channel: power
    value: "open"
  - id: drawer-open-3
    op: set
    device: storage_drawer_3
    channel: power
    value: "open"
  - id: drawer-open-4
    op: set
    device: storage_drawer_4
    channel: power
    value: "open"
  - id: to-reactor-1
    op: transfer
    sample: S-001
    to: synthesis
    position: R1
    "from": storage
    after: [drawer-open-1]
  - id: to-reactor-2
    op: transfer
    sample: S-002
    to: synthesis
    position: R2
    "from": storage
    after: [drawer-open-2]
  - id: to-reactor-3
    op: transfer
    sample: S-003
    to: synthesis
    position: R3
    "from": storage
    after: [drawer-open-3]
  - id: to-reactor-4
    op: transfer
    sample: S-004
    to: synthesis
    position: R4
    "from": storage
    after: [drawer-open-4]
  - id: hood-on
    op: set
    device: fume_hood
    channel: power
    value: "on"
  - id: stir-1
    op: set
    device: stirrer_1
    channel: power
    value: "on"
    after: [to-reactor-1, hood-on]
  - id: reactor-power-1
    op: set
    device: reactor_1
    channel: power
    value: "on"
    after: [stir-1]
  - id: heat-1
    op: set
    device: reactor_1
    channel: setpoint
    value: 80
    unit: degC
    after: [reactor-power-1]
  - id: hold-1
    op: hold
    seconds: 60
    after: [heat-1]
  - id: cool-1
    op: set
    device: reactor_1
    channel: setpoint
    value: 20
    unit: degC
    after: [hold-1]
  - id: stir-off-1
    op: set
    device: stirrer_1
    channel: power
    value: "off"
    after: [cool-1]
  - id: stir-2
    op: set
    device: stirrer_2
    channel: power
    value: "on"
    after: [to-reactor-2, hood-on]
  - id: reactor-power-2
    op: set
    device: reactor_2
    channel: power
    value: "on"
    after: [stir-2]
  - id: heat-2
    op: set
    device: reactor_2
    channel: setpoint
    value: 80
    unit: degC
    after: [reactor-power-2]
  - id: hold-2
    op: hold
    seconds: 60
    after: [heat-2]
  - id: cool-2
    op: set
    device: reactor_2
    channel: setpoint
    value: 20
    unit: degC
    after: [hold-2]
  - id: stir-off-2
    op: set
    device: stirrer_2
    channel: power
    value: "off"
    after: [cool-2]
  - id: stir-3
    op: set
    device: stirrer_3
    channel: power
    value: "on"
    after: [to-reactor-3, hood-on]
  - id: reactor-power-3
